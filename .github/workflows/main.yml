name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Mendeteksi dan mengekstrak jika Anda mengunggah file ZIP utuh
      - name: Extract ZIP if uploaded directly as archive
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP archive: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE" -d ./extracted_zip
            if [ -f "./extracted_zip/package.json" ]; then
              cp -rf ./extracted_zip/* .
            else
              SUBDIR=$(find ./extracted_zip -maxdepth 2 -name "package.json" -exec dirname {} \;)
              if [ -n "$SUBDIR" ]; then
                cp -rf "$SUBDIR"/* .
              fi
            fi
            rm -rf "$ZIP_FILE" ./extracted_zip
          fi

      # Setup Node.js tanpa 'cache: npm' agar tidak menuntut package-lock.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Application with Supabase Integration
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
